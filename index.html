<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اللوحة الأم ثلاثية الأبعاد | Advanced</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#070b14;--p:#0e1526;--p2:#141d33;--tx:#e8edf8;--mut:#8d9ab8;--ac:#4f8cff;--ac2:#22d3ee;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--bd:#24304d}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(1200px 700px at 50% 30%,#14213f 0%,#070b14 70%);color:var(--tx);font-family:Cairo,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer;color:var(--tx)}
#app{height:100dvh;display:grid;grid-template-columns:390px 1fr 190px}
#panel{background:linear-gradient(180deg,var(--p),#0a1020);border-inline-end:1px solid var(--bd);display:flex;flex-direction:column;min-height:0;z-index:3}
#tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--bd);background:rgba(8,13,26,.7)}
#tabs button{flex:1;background:none;border:1px solid transparent;border-radius:10px;padding:6px 2px;font-size:12px;font-weight:600;color:var(--mut);line-height:1.3}
#tabs button span{display:block;font-size:17px}
#tabs button.s{background:var(--ac);color:#fff;box-shadow:0 4px 16px rgba(79,140,255,.45)}
#tc{flex:1;overflow:auto;padding:14px 16px 30px;min-height:0;font-size:14px;line-height:1.85}
#tc h2{margin:2px 0 4px;font-size:19px}
#tc h3{margin:16px 0 6px;font-size:14px;color:var(--ac2)}
#tc p{margin:6px 0}
#tc small{color:var(--mut)}
.hd small{display:block;direction:ltr;text-align:start}
.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:1px 10px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);border:1px solid var(--c)}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.specs div{background:var(--p2);border:1px solid var(--bd);border-radius:10px;padding:6px 10px}
.specs small{display:block;font-size:11px}
.specs b{font-size:13px;direction:ltr;display:block;text-align:start;unicode-bidi:plaintext}
.tip{background:rgba(79,140,255,.12);border:1px solid rgba(79,140,255,.3);border-radius:10px;padding:8px 12px}
.row{display:flex;gap:8px;margin:10px 0}
.main{flex:1;background:linear-gradient(135deg,var(--ac),#7c5cff);color:#fff;border:0;border-radius:12px;padding:10px;font-size:15px;font-weight:700;box-shadow:0 6px 20px rgba(79,140,255,.35);width:100%;margin:6px 0}
.btn{background:var(--p2);border:1px solid var(--bd);border-radius:10px;padding:7px 12px;font-size:13px}
.btn:hover,.pi:hover{border-color:var(--ac)}
.btn.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--p2);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0}
.step{display:block;width:100%;text-align:start;background:var(--p2);border:1px solid var(--bd);border-radius:10px;padding:7px 12px;margin:5px 0;font-size:14px}
.step.s{border-color:var(--ac);background:rgba(79,140,255,.22)}
.rels,#plistM{display:flex;flex-wrap:wrap;gap:6px}
.pi{background:var(--p2);border:1px solid var(--bd);border-radius:16px;padding:4px 11px;font-size:12px;text-align:start}
.pi.s{border-color:var(--ac);background:rgba(79,140,255,.3)}
.pi.off{opacity:.5;text-decoration:line-through}
.cat{flex-basis:100%;font-size:11px;font-weight:700;color:var(--c);margin-top:6px}
#parts{background:rgba(10,16,32,.85);border-inline-start:1px solid var(--bd);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:5px;align-items:stretch}
#parts .pi{border-radius:8px}
#plistM .cat{margin-top:8px}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#top{position:absolute;top:10px;inset-inline:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
#top>*{pointer-events:auto}
#top b{font-size:17px;margin-inline-end:auto}
#top .by{flex-basis:100%;font-size:12px;color:var(--mut);margin-top:-6px;pointer-events:none}
#bot{position:absolute;bottom:10px;inset-inline:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center;background:rgba(10,16,32,.72);backdrop-filter:blur(8px);border:1px solid var(--bd);border-radius:14px;padding:7px 10px}
#bot label{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
input[type=range]{accent-color:var(--ac);width:100%}
#bot input[type=range]{width:110px}
input[type=number]{width:74px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:4px}
#toast{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;padding:8px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
#tipbox{position:absolute;pointer-events:none;background:rgba(14,21,38,.92);border:1px solid var(--ac);border-radius:8px;padding:3px 9px;font-size:12px;opacity:0;transition:opacity .15s;white-space:nowrap;z-index:6}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;background:rgba(14,21,38,.82);border:1px solid var(--bd);font-size:11px;padding:1px 7px;border-radius:6px;white-space:nowrap}
.lb.s{border-color:var(--ac);background:var(--ac);color:#fff}
.term{background:#04070d;border:1px solid var(--bd);border-radius:10px;font:12px/1.7 ui-monospace,Consolas,monospace;direction:ltr;text-align:left;padding:10px;min-height:130px;max-height:220px;overflow:auto;margin:8px 0}
.ok{color:var(--ok)}.wr{color:var(--warn)}.er{color:var(--bad)}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.blk{background:var(--p2);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;font-weight:700;transition:.25s}
.blk small{display:block;font-weight:400;direction:ltr;text-align:start;font-size:11px}
.blk.on{border-color:var(--ac2);background:rgba(34,211,238,.18);box-shadow:0 0 18px rgba(34,211,238,.3)}
.pg{display:grid;gap:2px;direction:ltr;margin:6px 0}.pg i{font-style:normal;text-align:center;font-size:11px;border-radius:3px;padding:2px 0;color:#fff;min-height:19px}
.c0{background:#0f7b80}.c1{background:#7c3aed}.c2{background:#2ea05a}.c3{background:#c2410c}
.bar{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--ac2),var(--ac));margin:2px 0}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.gauges div{background:var(--p2);border:1px solid var(--bd);border-radius:10px;padding:6px 10px}
.gauges small{display:block}.gauges b{font-size:20px;direction:ltr;display:block;text-align:start}
.badge{display:inline-block;padding:3px 12px;border-radius:20px;font-weight:700;font-size:13px}
details{background:var(--p2);border:1px solid var(--bd);border-radius:10px;padding:6px 12px;margin:6px 0}summary{cursor:pointer;font-weight:700}
canvas#ch{width:100%;height:auto;background:#04070d;border:1px solid var(--bd);border-radius:10px;cursor:default}
@media (max-width:980px){
 #app{grid-template-columns:1fr;grid-template-rows:52dvh 1fr}
 #stage{order:1}#panel{order:2;border-inline-end:0;border-top:1px solid var(--bd)}#parts{display:none}
 #tabs button{font-size:11px}#bot input[type=range]{width:80px}#top b{font-size:15px}
}
@media (min-width:981px){#plistM{display:none}}
</style>
</head>
<body>
<div id="app">
 <aside id="panel"><div id="tabs"></div><div id="tc"></div></aside>
 <main id="stage">
  <div id="labels"></div><div id="tipbox"></div><div id="toast"></div>
  <div id="top"><b>🖥️ Motherboard 3D <small style="color:var(--ac2)">Advanced</small></b>
   <button class="btn" onclick="setAll(false)">اخلع الكل</button>
   <button class="btn" onclick="setAll(true)">ركّب الكل</button>
   <button class="btn" id="mu" onclick="muteT()">🔊</button>
   <span class="by">prepared by TA Essam Mohamed</span></div>
  <div id="bot">
   <label>💥 فك الأجزاء <input id="ex" type="range" min="0" max="1" step=".01" value="0"></label>
   <button class="btn" id="bx" onclick="optT('xray')">🩻 X-Ray</button>
   <button class="btn" id="bl" onclick="optT('labels')">🏷️ الأسماء</button>
   <button class="btn on" id="bf" onclick="optT('flow')">⚡ تدفق البيانات</button>
   <button class="btn" id="ba" onclick="optT('auto')">🔄 دوران</button>
   <button class="btn" onclick="view('iso')">🧭 زاوية</button>
   <button class="btn" onclick="view('top')">⬆️ علوي</button>
   <button class="btn" onclick="view('side')">➡️ جانبي</button>
  </div>
 </main>
 <aside id="parts"></aside>
</div>
<script>
addEventListener('error',function(e){if(!(e.message||(e.target&&e.target.tagName==='SCRIPT'))||document.getElementById('err'))return;var d=document.createElement('div');d.id='err';d.style.cssText='position:fixed;inset:90px 20px auto;margin:auto;max-width:420px;background:#c0392b;color:#fff;padding:14px 16px;border-radius:12px;font-size:14px;line-height:1.8;z-index:20';d.textContent=window.THREE?'حصل خطأ في تشغيل المشهد ثلاثي الأبعاد. جرّب Chrome أو Edge وفعّل Hardware acceleration.':'مكتبة الـ 3D (three.js) ماتحمّلتش. تأكد إن الجهاز متصل بالإنترنت.';document.body.appendChild(d)},true);
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>window.THREE||document.write('<scr'+'ipt src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></scr'+'ipt>')</script>
<script>
/* ================= أدوات عامة ================= */
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),Y=.15,shuffle=a=>[...a].sort(()=>Math.random()-.5),sleep=ms=>new Promise(r=>setTimeout(r,ms));
let AC=null,muted=false;
function snd(f,d,ty,v,when){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.value=v||.05;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+(when||0);o.start(t);g.gain.setTargetAtTime(0,t+d*.7,d*.12);o.stop(t+d+.15)}catch(e){}}
function muteT(){muted=!muted;$('mu').textContent=muted?'🔇':'🔊'}
function toast(t,ok){const e=$('toast');e.textContent=t;e.style.background=ok?'#059669':'';e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2400)}

/* ================= البيانات التعليمية ================= */
const CATS=[['الأساسيات','#4f8cff'],['الذاكرة والتخزين','#34d399'],['التوسعة','#fb923c'],['الطاقة والتوصيل','#c084fc']];
const DATA={
board:{c:0,n:'اللوحة الأم',en:'Motherboard',d:'الأساس اللي بيربط كل مكونات الكمبيوتر ببعض. لوحة PCB متعددة الطبقات فيها مسارات نحاسية (Traces) بتنقل البيانات والكهرباء بين القطع.',t:'لازم مقاس اللوحة يناسب الكيس: ATX أو Micro-ATX أو Mini-ITX.',s:[['المقاس','ATX / mATX / ITX'],['الطبقات','4 – 8 طبقات نحاس'],['النواقل','PCIe • SATA • USB']],r:['socket','ramslots','pcie','io']},
socket:{c:0,n:'سوكت المعالج',en:'CPU Socket',d:'المكان اللي بيتركّب فيه المعالج. ليه ذراع تثبيت وآلاف نقاط التلامس، ولازم يتوافق مع نوع المعالج.',t:'المثلث الذهبي الصغير في الركن لازم يتطابق مع مثلث المعالج. اخلع المعالج وشوفه.',s:[['النوع','LGA1700 • AM5'],['التثبيت','ذراع ضغط'],['نقاط التلامس','1700+ نقطة']],r:['cpu','cooler','cpu8']},
cpu:{c:0,n:'المعالج',en:'CPU (Processor)',d:'عقل الجهاز. بينفذ التعليمات والحسابات وبيتحكم في باقي المكونات. بيتميز بعدد الأنوية (Cores) والتردد (GHz) والكاش.',t:'ركّبه من غير ضغط وبمحاذاة المثلث الذهبي. أي ثني في الدبابيس بيبوّظ السوكت.',s:[['الأنوية','4 – 24'],['التردد','3 – 6 GHz'],['الكاش','L1 / L2 / L3'],['الشركات','Intel • AMD • ARM']],r:['socket','cooler','ramslots','cpu8']},
cooler:{c:0,n:'مبرد المعالج',en:'CPU Cooler (Heat Sink + Fan)',d:'المشتت المعدني بيوزّع الحرارة والمروحة بتطردها، والمعجون الحراري (Thermal Paste) بيملا الفراغات بينه وبين المعالج. وفيه كمان التبريد السائل (Liquid Cooling).',t:'لازم تخلعه قبل المعالج وتركّبه بعده، والبرنامج هيمنعك لو عملت العكس. جرّب تخلعه وروح لتاب «الأداء».',s:[['النوع','هوائي / سائل'],['المروحة','1500 – 2200 RPM'],['المعجون','Thermal Paste']],r:['cpu','vrm']},
ramslots:{c:1,n:'خانات الرام',en:'RAM Slots (DIMM)',d:'الأماكن اللي بتركّب فيها شرايح الذاكرة، ولها أقفال على الطرفين بتتقفل لوحدها لما تضغط الرام.',t:'للأداء الأفضل (Dual Channel) ركّب شريحتين في الخانتين 2 و4.',s:[['العدد','2 أو 4'],['القنوات','Dual Channel'],['الأقفال','على الطرفين']],r:['ram','cpu']},
ram:{c:1,n:'الرام',en:'RAM (Memory)',d:'ذاكرة مؤقتة سريعة بتشيل البرامج والبيانات اللي شغالة دلوقتي، وبتتمسح لما الكهرباء تقطع.',t:'DDR4 وDDR5 مش متوافقين: مكان الفتحة في الريجل بيمنع التركيب الغلط. جرّب تشغّل الإقلاع من غير رام.',s:[['النوع','DDR4 / DDR5'],['السعة','8 – 64 GB'],['السرعة','3200 – 7200 MT/s']],r:['ramslots','cpu']},
vrm:{c:0,n:'مشتتات VRM',en:'VRM Heatsinks',d:'دوائر تحويل الجهد: بتنزّل 12 فولت من الباور سبلاي لحوالي 1 فولت يناسب المعالج. بتسخن فبيتحط عليها مشتت.',t:'VRM قوي = ثبات أعلى مع المعالجات القوية والأوفركلوك.',s:[['الدخل','12 V'],['الخرج','~1 V'],['المراحل','8 – 20 Phase']],r:['cpu8','cpu']},
chipset:{c:0,n:'الشيبست',en:'Chipset',d:'بيتحكم في تدفق البيانات بين المعالج والذاكرة والأجهزة (USB وSATA والشبكة والصوت). في اللوحات القديمة كان مقسوم لـ North Bridge وSouth Bridge.',t:'أمثلة: Intel Z790 / AMD B650. وهو اللي بيحدد إمكانيات اللوحة.',s:[['أمثلة','Z790 • B650'],['بيدير','USB • SATA • LAN'],['الاتصال بالمعالج','DMI / PCIe']],r:['cpu','sata','pciex1']},
pcie:{c:2,n:'خانة PCIe x16',en:'PCIe x16 Slot',d:'أسرع خانة في اللوحة، بتركّب فيها كارت الشاشة غالباً، وفيها ريجل تثبيت في الطرف.',t:'أرقام x1 / x4 / x16 = عدد مسارات البيانات (Lanes)، كل ما زادت زادت السرعة.',s:[['المسارات','16 Lane'],['الجيل','PCIe 4.0 / 5.0'],['السرعة','حتى 63 GB/s']],r:['gpu','cpu']},
gpu:{c:2,n:'كارت الشاشة',en:'GPU (Graphics Card)',d:'معالج مخصص للرسومات والألعاب والذكاء الاصطناعي، وفيه رام خاصة (VRAM) ومراوح تبريد. بيوصل الشاشات بـ HDMI أو DisplayPort.',t:'بياخد كهرباء إضافية من الباور سبلاي (كابل PCIe 6/8 pin) وبيتثبت بمسمار في الكيس.',s:[['الذاكرة','VRAM 8 – 24 GB'],['الاستهلاك','100 – 450 W'],['الشاشات','HDMI • DisplayPort']],r:['pcie','cpu']},
pciex1:{c:2,n:'فتحات التوسعة',en:'PCIe x1 Slots (Expansion)',d:'فتحات لكروت التوسعة (Expansion Cards): كروت الصوت والشبكة، ومنافذ USB إضافية ومتحكمات التخزين والتقاط الفيديو وكروت القياس (DAQ).',t:'الكارت بيتركّب عمودي على اللوحة وبيتثبت بمسمار في الكيس.',s:[['المسارات','1 Lane'],['الأنواع','صوت • شبكة • USB • DAQ']],r:['sound','nic','chipset']},
sound:{c:2,n:'كارت الصوت',en:'Sound Card',d:'بيوصّل السماعات والميكروفونات بجودة صوت أفضل من الصوت المدمج.',t:'بيتركّب في فتحة PCIe.',s:[['الواجهة','PCIe x1'],['المخارج','Line • Mic • Optical']],r:['pciex1']},
nic:{c:2,n:'كارت الشبكة',en:'NIC (Network Interface Card)',d:'بيوصّل الحاسوب بالشبكة سلكيًا (Ethernet) أو لاسلكيًا (Wi-Fi) لإنترنت عالي السرعة.',t:'معظم اللوحات الحديثة فيها شبكة مدمجة، لكن ممكن تضيف كارت لسرعات أعلى.',s:[['السرعة','1 – 10 Gbps'],['النوع','Ethernet • Wi-Fi']],r:['pciex1']},
m2:{c:1,n:'خانة M.2',en:'M.2 SSD Slot',d:'خانة صغيرة لهارد SSD بشكل شريحة. بتدعم NVMe وبتوصل مباشرة بالمعالج من غير كابلات.',t:'الهارد بيتركّب بزاوية صغيرة ثم يتضغط وينثبت بمسمار في الطرف.',s:[['الواجهة','PCIe NVMe • SATA'],['المقاسات','2242 • 2280 • 22110']],r:['ssd','cpu']},
ssd:{c:1,n:'هارد NVMe SSD',en:'NVMe SSD',d:'تخزين فلاش سريع جداً بيستخدم PCIe، أسرع بكتير من هارد SATA والهارد العادي.',t:'ممكن يوصل لـ 7000 MB/s أو أكتر حسب الجيل (Gen4 / Gen5). من غيره الجهاز مالوش جهاز إقلاع.',s:[['الواجهة','PCIe Gen4 / Gen5'],['السرعة','7000+ MB/s'],['الشكل','M.2 2280']],r:['m2']},
sata:{c:1,n:'منافذ SATA',en:'SATA Ports',d:'منافذ لتوصيل هاردات SATA وسواقات الأقراص بكابل بيانات، وبتحتاج كابل كهرباء منفصل من الباور سبلاي.',t:'سرعتها تقريباً 600 MB/s، أقل بكتير من NVMe.',s:[['السرعة','600 MB/s'],['العدد','4 – 8 منافذ']],r:['chipset']},
atx24:{c:3,n:'كونكتور 24-Pin',en:'24-Pin ATX Power',d:'الكابل الرئيسي لتغذية اللوحة من الباور سبلاي (PSU).',t:'الكونكتور ليه قفل ومش بيدخل غير باتجاه واحد.',s:[['الجهود','+12 • +5 • +3.3 V'],['الدبابيس','24 Pin']],r:['cpu8','chipset']},

/* ================= الاختبارات والتحديات ================= */
const QT=['socket','ramslots','chipset','pcie','m2','sata','bios','battery','atx24','io','cpu8','gpu','cooler','ssd','vrm','pciex1'];
const QS=[['اذكر أربعة مكونات على اللوحة الأم.','مثلاً: سوكت المعالج، فتحات الرام، الشيبست، فتحات PCIe، M.2، SATA، BIOS.'],['ما وظيفة الفحص الذاتي POST؟','يفحص المعالج والذاكرة والأجهزة عند بدء التشغيل.'],['وظيفة وحدة التحكم و ALU؟','CU تجلب وتفك التعليمات وتنسّق الأجزاء، وALU تجري العمليات الحسابية والمنطقية.'],['مراحل دورة الآلة بالترتيب؟','Fetch ← Decode ← Execute ← Store'],['معالج 2.5 GHz: كم دورة في الثانية وما زمن الدورة؟','2.5 مليار دورة في الثانية، وزمن الدورة = 1 ÷ 2.5 GHz = 0.4 نانوثانية.'],['كم دورة لأربع تعليمات بدون خط أنابيب ومعه؟','16 دورة بدونه، و7 دورات معه.'],['ليه لازم تخلع المبرد قبل المعالج؟','لأن المبرد متثبّت فوق المعالج بالمعجون الحراري، وفكّه الأول بيحمي دبابيس السوكت.'],['الفرق بين BIOS وUEFI؟','BIOS قديم بواجهة نصية، وUEFI حديث برسومية وماوس وأقراص كبيرة وإقلاع آمن (Secure Boot).'],['ليه الـ Dual Channel أسرع؟','لأن شريحتين بتشتغلوا بالتوازي فبيضاعفوا عرض نطاق الذاكرة.'],['إيه اللي بيحصل لو الحرارة عدّت 90°م؟','المعالج بيقلّل التردد (Thermal Throttling)، ولو زادت جداً بيفصل لحماية نفسه.']];
let qz=null,ch=null,tT=0;
const best=()=>{try{return +localStorage.getItem('mb_best')||0}catch(e){return 0}};
function quizH(){return `<h2>🎯 اختبر نفسك</h2>
 <div class="card"><b>1) سمّي الأجزاء</b><p>هسألك عن 10 قطع، وتضغط عليها في المجسّم. أفضل نتيجة: <b>${best()}</b>/100</p><button class="main" style="margin:0" onclick="startId()">ابدأ التمرين</button></div>
 <div class="card"><b>2) تحدي التركيب ⏱️</b><p>كل القطع هتتخلع، ركّبها كلها بأسرع وقت (والمعالج قبل المبرد).</p><button class="main" style="margin:0" onclick="startCh()">ابدأ التحدي</button></div>
 <div id="qa"></div><h3>أسئلة المراجعة</h3>${QS.map((q,i)=>`<details><summary>Q${i+1}: ${q[0]}</summary>${q[1]}</details>`).join('')}`}
function startId(){qz={q:shuffle(QT).slice(0,10),i:0,s:0,w:0,t0:Date.now()};$('qa').innerHTML='<div id="qq" class="tip"></div>';nextQ()}
function nextQ(){if(qz.i>=qz.q.length){const sc=qz.s,b=best();try{if(sc>b)localStorage.setItem('mb_best',sc)}catch(e){}qHint=null;$('qa').innerHTML=`<div class="card" style="border-color:var(--ok)"><b>🎉 خلصت! نتيجتك ${sc}/100</b><p>${sc>=90?'ممتاز! 🏆':sc>=60?'كويس جداً 👏':'كمّل تدريب وهتتحسّن 💪'}</p></div>`;qz=null;return}
 $('qq').innerHTML=`${qz.i+1}/${qz.q.length} — فين <b>${DATA[qz.q[qz.i]].n}</b> <small>(${DATA[qz.q[qz.i]].en})</small>؟<br><small>النقاط: ${qz.s}</small>`;qHint=null;qz.m=0}
function qHook(id){const t=qz.q[qz.i];if(id===t){qz.s+=Math.max(2,10-qz.m*4);PT[id].fl=1;PT[id].fc=0x34d399;snd(660,.12,'triangle',.05);snd(880,.12,'triangle',.05,.1);qz.i++;nextQ()}
 else{qz.m++;snd(180,.2,'square',.04);toast(qz.m>=2?'مش ده، الجزء بيلمع دلوقتي 👀':'مش ده، جرّب تاني');if(qz.m>=2)qHint=t}return true}
function startCh(){setAll(false);ch={t0:Date.now(),done:false};chCheck()}
function chCheck(){if(!ch||!$('qa'))return;const rem=ORDER.filter(i=>PT[i].rem);const left=rem.filter(i=>!PT[i].on);
 if(!left.length&&!ch.done){ch.done=true;ch.t=((Date.now()-ch.t0)/1000).toFixed(1);[523,659,784,1046].forEach((f,i)=>snd(f,.15,'triangle',.05,i*.12))}
 $('qa').innerHTML=ch.done?`<div class="card" style="border-color:var(--ok)"><b>🏁 خلصت التركيب في ${ch.t} ثانية!</b></div>`:`<div class="card"><b>⏱️ <span id="chT">0.0</span> ث</b> — باقي ${left.length}<br>${rem.map(i=>`<button class="pi ${PT[i].on?'s':''}" onclick="toggle('${i}')">${PT[i].on?'✔':'○'} ${lab(i)}</button> `).join('')}</div>`}

/* ================= التبويبات ================= */
const TABS=[['🔍','المكونات'],['🚀','الإقلاع'],['🧠','المعالج'],['🌡️','الأداء'],['🎯','اختبار']];
let cur=-1;
$('tabs').innerHTML=TABS.map((t,i)=>`<button onclick="tab(${i})"><span>${t[0]}</span>${t[1]}</button>`).join('');
function tab(i){if(cur===i&&i!==0)return;if(qz&&i!==4)qz=null;qHint=null;if(i!==4)ch=null;clearInterval(tT);tT=0;bTok++;ledForce=null;cur=i;
 [...$('tabs').children].forEach((b,j)=>b.classList.toggle('s',j===i));
 if(i===0){renderInfo();return}
 $('tc').innerHTML=[null,bootH,cpuH,thermalH,quizH][i]();
 if(i===1){bootStep(0);bootWarn()}
 if(i===2){clk();pipe();amd()}
 if(i===3){tT=setInterval(thermalUI,120)}
 if(i===4){tT=setInterval(()=>{if(ch&&!ch.done&&$('chT'))$('chT').textContent=((Date.now()-ch.t0)/1000).toFixed(1)},100)}
 renderList()}

/* ================= الحلقة الرئيسية ================= */
const LB={},lbv=new THREE.Vector3();let last=performance.now(),T=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
 exCur+=(exT-exCur)*Math.min(1,dt*6);
 ORDER.forEach(id=>{const p=PT[id],ty=p.home+(p.on?0:LIFT[id]||0)+exCur*p.ex;p.g.position.y+=(ty-p.g.position.y)*Math.min(1,dt*8)});
 simStep(dt);
 RGB.forEach(r=>r[0].color.setHSL((T*.12+r[1])%1,1,.55));
 const gs=PT.gpu.on&&!S.trip?.2+S.load/100*.8:0;
 FANS.forEach(f=>{f.s.rotation.y+=dt*(f.type==='cpu'?(PT.cpu.on&&!S.trip?S.fan*34+.8:0):gs*30+.8*(PT.gpu.on?1:0))});
 if(PT.cpu.x.gl)PT.cpu.x.gl.material.opacity=clamp((S.temp-55)/55,0,.85);
 LED.material.color.setHex(ledForce!==null?ledForce:S.trip?0xf87171:S.temp>90?0xfbbf24:0x34d399);
 const fv=flowOn&&exCur<.15&&!S.trip,sp=.1+S.load/100*.45;
 FL.forEach(f=>{const v=fv&&f.need();f.grp.visible=v;if(v)f.ps.forEach((q,i)=>{let u=(i/f.ps.length+T*sp*(i%2?-1:1))%1;if(u<0)u+=1;q.position.copy(f.cv.getPoint(u))})});
 ORDER.forEach(id=>{const p=PT[id];let c=0,i=0;if(id===sel){c=0x2f6bff;i=.45+.25*Math.sin(T*3)}else if(id===hov){c=0x1d4ed8;i=.3}
  if(p.fl>0){c=p.fc;i=Math.max(i,p.fl);p.fl-=dt*1.2}
  if(qHint===id){c=0xfbbf24;i=.5+.4*Math.sin(T*8)}
  p.mats.forEach(m=>{m.emissive.setHex(c);m.emissiveIntensity=i})});
 camUpdate();
 const W=stage.clientWidth,H=stage.clientHeight,show=new Set(labelsOn?ORDER:[]);if(sel)show.add(sel);if(hov)show.add(hov);
 ORDER.forEach(id=>{let e=LB[id];if(!show.has(id)){if(e)e.style.display='none';return}
  if(!e){e=LB[id]=document.createElement('div');e.className='lb';e.textContent=lab(id);$('labels').appendChild(e)}
  const p=PT[id];lbv.set(p.g.position.x+p.c.x,p.g.position.y+p.top+.25,p.g.position.z+p.c.z).project(cam);
  if(lbv.z>1){e.style.display='none';return}e.style.display='block';e.classList.toggle('s',id===sel);
  e.style.transform=`translate(${(lbv.x*.5+.5)*W}px,${(-lbv.y*.5+.5)*H}px) translate(-50%,-110%)`});
 R.render(scene,cam)}
requestAnimationFrame(loop);
tab(0);view('iso');
</script>
</body>
</html>
